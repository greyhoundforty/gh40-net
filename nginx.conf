# Served by the container (see Dockerfile). Redirects keep links to the old
# second blog (www.ryantiffany.com/<slug>/) working now that posts live under /posts/.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    error_page 404 /404.html;

    if ($host = www.ryantiffany.com) {
        return 301 https://ryantiffany.com$request_uri;
    }

    location = /2024-homelab-recap/ { return 301 /posts/2024-homelab-recap/; }
    location = /homelab-monitoring/ { return 301 /posts/homelab-monitoring/; }
    location = /default-apps-2025/ { return 301 /posts/default-apps-2025/; }
    location = /expose-local-services-to-your-tailnet-and-beyond-with-serve-and-funnel/ { return 301 /posts/expose-local-services-to-your-tailnet-and-beyond-with-serve-and-funnel/; }
    location = /claude-oco/ { return 301 /posts/claude-oco/; }
    location = /claude-mcp-cookiecutter/ { return 301 /posts/claude-mcp-cookiecutter/; }
    location = /ibmcloud-vpc-mcp/ { return 301 /posts/ibmcloud-vpc-mcp/; }
    location = /tg-ssh-manager/ { return 301 /posts/tg-ssh-manager/; }
    location = /new-project-kylfuskofu/ { return 301 /posts/new-project-kylfuskofu/; }
    location = /seven-songs-the-beths/ { return 301 /posts/seven-songs-the-beths/; }
    location = /thanks-i-hate-it/ { return 301 /posts/thanks-i-hate-it/; }
    location = /today-i-found-volume-2/ { return 301 /posts/today-i-found-volume-2/; }
    location = /today-i-found-volume-3/ { return 301 /posts/today-i-found-volume-3/; }
    location = /today-i-found-volume-2025-01-03/ { return 301 /posts/today-i-found-volume-2025-01-03/; }
    location = /today-i-found-volume-2025-01-09/ { return 301 /posts/today-i-found-volume-2025-01-09/; }
    location = /today-i-found-volume-2025-03-03/ { return 301 /posts/today-i-found-volume-2025-03-03/; }
    location = /getting-started-with-terraform/ { return 301 /posts/getting-started-with-terraform/; }
    location = /deploy-request-baskets-on-ibm-cloud-code-engine-using-terraform/ { return 301 /posts/code-engine-rb/; }
    location = /expose-vpc-services-to-your-local-network-with-custom-resolvers-and-tailscale/ { return 301 /posts/ibmcloud-pdns-vpc/; }
    location = /refresh-schematics-workspaces-using-code-engine-periodic-timer/ { return 301 /posts/code-engine-schematics/; }
    location = /today-i-found-volume-1/ { return 301 /posts/tif-1/; }
    location = /use-terraform-to-deploy-a-tailscale-subnet-router-for-interconnecting-ibm-cloud-vpcs/ { return 301 /posts/ibmcloud-vpc-tailscale/; }
    location = /using-ibm-cloud-code-engine-as-a-webhook-receiver/ { return 301 /posts/code-engine-webhook/; }
    location = /cheat-sheets/ { return 301 /cheatsheets/; }
    location = /today-i-found/ { return 301 /tags/todayifound/; }
    location = /projects/ { return 301 /about/; }
    location = /elsewhere/ { return 301 /about/; }

    location / {
        try_files $uri $uri/ =404;
    }
}
